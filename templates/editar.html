{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Editar Mascota</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('mascota.editar', id=mascota.id_mascota) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Dueño (Cliente)</label>
                        <select name="id_cliente" class="form-select" required>
                            {% for c in clientes %}
                            <option value="{{ c.id_cliente }}" {% if c.id_cliente == mascota.id_cliente %}selected{% endif %}>
                                {{ c.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre de la Mascota</label>
                        <input type="text" name="nombre" class="form-control" value="{{ mascota.nombre }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Especie</label>
                        <input type="text" name="especie" class="form-control" value="{{ mascota.especie }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Raza</label>
                        <input type="text" name="raza" class="form-control" value="{{ mascota.raza or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" name="fecha_nacimiento" class="form-control" value="{{ mascota.fecha_nacimiento or '' }}">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('mascota.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-warning">Actualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
