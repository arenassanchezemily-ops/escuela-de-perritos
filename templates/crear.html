{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Registrar Mascota</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('mascota.crear') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Dueño (Cliente)</label>
                        <select name="id_cliente" class="form-select" required>
                            <option value="">-- Seleccione un Dueño --</option>
                            {% for c in clientes %}
                            <option value="{{ c.id_cliente }}">{{ c.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre de la Mascota</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Especie</label>
                        <input type="text" name="especie" class="form-control" value="Perro" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Raza</label>
                        <input type="text" name="raza" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" name="fecha_nacimiento" class="form-control">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('mascota.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
